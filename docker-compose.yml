services:
  appdb:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "5433:5432"
    volumes:
      - appdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      retries: 30
  web:
    build: .
    restart: unless-stopped
    depends_on:
      appdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@appdb:5432/ledger
      PLATFORM_KEY: ${PLATFORM_KEY:-dev-platform-key}
volumes:
  appdb-data:
